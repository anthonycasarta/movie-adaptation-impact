[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-adaptation-impact"
version = "0.1.0"
description = "Collect Wikipedia film adaptation pairs"
requires-python = ">=3.9"
dependencies = [
  "requests",
  "beautifulsoup4",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[project.scripts]
movie-adaptation-impact = "src.collectors.wikipedia:main"

[tool.setuptools]
packages = ["src", "src.collectors", "src.pipeline", "src.utils"]
